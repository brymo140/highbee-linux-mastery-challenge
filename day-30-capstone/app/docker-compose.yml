services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zeetafin_secure_pw_2026
      POSTGRES_DB: zeetafin
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./ZeetaFin-BE
      dockerfile: ../Dockerfile.backend
    restart: always
    env_file:
      - backend.env
    depends_on:
      - db
    ports:
      - "3001:3001"

  frontend:
    build:
      context: ./ZeetaFin-FE
      dockerfile: ../Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: http://zeetafin.duckdns.org:3001/api
    restart: always
    depends_on:
      - backend
    ports:
      - "80:3000"

volumes:
  pgdata:
